name: Security Toolkit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    runs-on: ['ubuntu-latest']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install security-toolkit 0.1.2 (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) rid=linux-x64; sum=3d0728d8647a2f1f20e3e474d23409808a4b6dc9594c7312373f3b98f5f0bde6 ;;
            aarch64|arm64) rid=linux-arm64; sum=722d8d7c1bee3457a866cdf3e37023b65c01e7c8b682de385b3b24ef7b4d961f ;;
            *) echo "security-toolkit: unsupported architecture $(uname -m)" >&2; exit 2 ;;
          esac
          dir="${{ runner.temp }}/security-toolkit-bin"
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/security-toolkit" "https://github.com/barcsaidominik/SecurityToolkit/releases/download/v0.1.2/security-toolkit-$rid"
          echo "$sum  $dir/security-toolkit" | sha256sum -c --quiet -
          chmod +x "$dir/security-toolkit"
          echo "$dir" >> "$GITHUB_PATH"

      - name: Install security-toolkit 0.1.2 (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          set "dir=${{ runner.temp }}\security-toolkit-bin"
          if not exist "%dir%" mkdir "%dir%" || exit /b 2
          curl.exe -fsSL --retry 3 -o "%dir%\security-toolkit.exe" "https://github.com/barcsaidominik/SecurityToolkit/releases/download/v0.1.2/security-toolkit-win-x64.exe" || exit /b 2
          certutil -hashfile "%dir%\security-toolkit.exe" SHA256 | findstr /i /x "4fee582131f63e0bdb93e8e6b8a45fa0819547636ece393b20cf032e23460057" >nul || (echo security-toolkit: checksum mismatch & exit /b 2)
          >>"%GITHUB_PATH%" echo %dir%

      - name: Initialize pinned security tools
        run: security-toolkit provision --project-root "${{ github.workspace }}" --require-pinned

      - name: 'Security scan: analyzers'
        if: ${{ !cancelled() }}
        run: security-toolkit scan --project-root "${{ github.workspace }}" --tool analyzers --mode Report --run-id ${{ github.run_id }}-${{ github.run_attempt }}

      - name: 'Security scan: nuget'
        if: ${{ !cancelled() }}
        run: security-toolkit scan --project-root "${{ github.workspace }}" --tool nuget --mode Report --run-id ${{ github.run_id }}-${{ github.run_attempt }}

      - name: 'Security scan: semgrep'
        if: ${{ !cancelled() }}
        run: security-toolkit scan --project-root "${{ github.workspace }}" --tool semgrep --mode Report --run-id ${{ github.run_id }}-${{ github.run_attempt }}

      - name: 'Security scan: gitleaks'
        if: ${{ !cancelled() }}
        run: security-toolkit scan --project-root "${{ github.workspace }}" --tool gitleaks --mode Report --run-id ${{ github.run_id }}-${{ github.run_attempt }} --history

      - name: 'Security scan: osv'
        if: ${{ !cancelled() }}
        run: security-toolkit scan --project-root "${{ github.workspace }}" --tool osv --mode Report --run-id ${{ github.run_id }}-${{ github.run_attempt }}

      - name: 'Security scan: devskim'
        if: ${{ !cancelled() }}
        run: security-toolkit scan --project-root "${{ github.workspace }}" --tool devskim --mode Report --run-id ${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload security results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-results
          path: .security/results
