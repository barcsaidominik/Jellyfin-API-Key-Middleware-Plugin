name: Security Toolkit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    runs-on: ['ubuntu-latest']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install security-toolkit 0.1.3 (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) rid=linux-x64; sum=dc481d2fa18f6d472908ccc72048165e8c4a73df28394a3b3dc5753debecc39d ;;
            aarch64|arm64) rid=linux-arm64; sum=c3ca3881df2ea6debdd1271fa75407f1cc91a5f30456252583ad9568a1780d2d ;;
            *) echo "security-toolkit: unsupported architecture $(uname -m)" >&2; exit 2 ;;
          esac
          dir="${{ runner.temp }}/security-toolkit-bin"
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/security-toolkit" "https://github.com/barcsaidominik/SecurityToolkit/releases/download/v0.1.3/security-toolkit-$rid"
          echo "$sum  $dir/security-toolkit" | sha256sum -c --quiet -
          chmod +x "$dir/security-toolkit"
          echo "$dir" >> "$GITHUB_PATH"

      - name: Install security-toolkit 0.1.3 (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          set "dir=${{ runner.temp }}\security-toolkit-bin"
          if not exist "%dir%" mkdir "%dir%" || exit /b 2
          curl.exe -fsSL --retry 3 -o "%dir%\security-toolkit.exe" "https://github.com/barcsaidominik/SecurityToolkit/releases/download/v0.1.3/security-toolkit-win-x64.exe" || exit /b 2
          certutil -hashfile "%dir%\security-toolkit.exe" SHA256 | findstr /i /x "a81999d0894dc5a3f8e31a98a10363c33e5a7fdca6551acd1fa012ba6e51ff0d" >nul || (echo security-toolkit: checksum mismatch & exit /b 2)
          >>"%GITHUB_PATH%" echo %dir%

      - name: Initialize pinned security tools
        run: security-toolkit provision --project-root "${{ github.workspace }}" --require-pinned

      - name: 'Security scan: analyzers'
        if: ${{ !cancelled() }}
        run: security-toolkit scan --project-root "${{ github.workspace }}" --tool analyzers --mode Report --run-id ${{ github.run_id }}-${{ github.run_attempt }}

      - name: 'Security scan: nuget'
        if: ${{ !cancelled() }}
        run: security-toolkit scan --project-root "${{ github.workspace }}" --tool nuget --mode Report --run-id ${{ github.run_id }}-${{ github.run_attempt }}

      - name: 'Security scan: semgrep'
        if: ${{ !cancelled() }}
        run: security-toolkit scan --project-root "${{ github.workspace }}" --tool semgrep --mode Report --run-id ${{ github.run_id }}-${{ github.run_attempt }}

      - name: 'Security scan: gitleaks'
        if: ${{ !cancelled() }}
        run: security-toolkit scan --project-root "${{ github.workspace }}" --tool gitleaks --mode Report --run-id ${{ github.run_id }}-${{ github.run_attempt }} --history

      - name: 'Security scan: osv'
        if: ${{ !cancelled() }}
        run: security-toolkit scan --project-root "${{ github.workspace }}" --tool osv --mode Report --run-id ${{ github.run_id }}-${{ github.run_attempt }}

      - name: 'Security scan: devskim'
        if: ${{ !cancelled() }}
        run: security-toolkit scan --project-root "${{ github.workspace }}" --tool devskim --mode Report --run-id ${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload security results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-results
          path: .security/results
